<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
  />

  <!-- Primary SEO -->
  <title>Margin — Study Notes | ARVEX</title>

  <meta
    name="description"
    content="Margin is a study notes platform by ARVEX. Find and study clear, chapter-wise notes for your subjects."
  />

  <meta
    name="keywords"
    content="Margin, ARVEX, study notes, class 10 notes, CBSE notes, chapter wise notes, subject notes, revision notes"
  />

  <meta name="author" content="ARVEX" />

  <meta
    name="robots"
    content="index, follow, max-image-preview:large, max-snippet:-1, max-video-preview:-1"
  />

  <meta name="googlebot" content="index, follow" />

  <!-- Canonical URL -->
  <link
    rel="canonical"
    href="https://bhuvnesh734.github.io/Notes-Website/"
  />

  <!-- Google Search Console Verification -->
  <meta
    name="google-site-verification"
    content="A4gOBzg1f67kAxOy-w7t7Y8K1JG0s-TTGPcCbkaqrsg"
  />

  <!-- Theme / Browser -->
  <meta name="theme-color" content="#ffffff" />
  <meta name="application-name" content="Margin" />

  <!-- Open Graph -->
  <meta property="og:type" content="website" />

  <meta
    property="og:title"
    content="Margin — Study Notes | ARVEX"
  />

  <meta
    property="og:description"
    content="Study clear, chapter-wise subject notes with Margin by ARVEX."
  />

  <meta
    property="og:url"
    content="https://bhuvnesh734.github.io/Notes-Website/"
  />

  <meta
    property="og:site_name"
    content="Margin by ARVEX"
  />

  <meta property="og:locale" content="en_IN" />

  <!-- Twitter / X -->
  <meta name="twitter:card" content="summary" />

  <meta
    name="twitter:title"
    content="Margin — Study Notes | ARVEX"
  />

  <meta
    name="twitter:description"
    content="Chapter-wise study notes by Margin, a study platform from ARVEX."
  />

  <!-- Favicon -->
  <link
    rel="icon"
    href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>📝</text></svg>"
  />

  <!-- Preconnect -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link
    rel="preconnect"
    href="https://fonts.gstatic.com"
    crossorigin
  />

  <!-- Fonts -->
  <link
    href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap"
    rel="stylesheet"
  />

  <!-- Styles -->
  <link rel="stylesheet" href="style.css" />

  <!--
    ============================================================
    ARVEX → MARGIN STRUCTURED DATA
    ============================================================
  -->

  <!-- ARVEX Organization -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "Organization",
    "@id": "https://bhuvnesh734.github.io/Notes-Website/#arvex",
    "name": "ARVEX",
    "url": "https://bhuvnesh734.github.io/Notes-Website/",
    "brand": {
      "@type": "Brand",
      "name": "ARVEX"
    }
  }
  </script>

  <!-- Margin Website -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "WebSite",
    "@id": "https://bhuvnesh734.github.io/Notes-Website/#margin",
    "name": "Margin",
    "alternateName": "Margin — Study Notes",
    "url": "https://bhuvnesh734.github.io/Notes-Website/",
    "description": "Margin is a study notes platform by ARVEX for finding and studying clear, chapter-wise subject notes.",
    "publisher": {
      "@id": "https://bhuvnesh734.github.io/Notes-Website/#arvex"
    },
    "inLanguage": "en-IN",
    "potentialAction": {
      "@type": "SearchAction",
      "target": {
        "@type": "EntryPoint",
        "urlTemplate": "https://bhuvnesh734.github.io/Notes-Website/#/search?q={search_term_string}"
      },
      "query-input": "required name=search_term_string"
    }
  }
  </script>

</head>

<body>

  <a class="skip-link" href="#view-root">
    Skip to content
  </a>

  <!-- Header -->
  <header class="site-header">

    <div class="site-header__row">

      <!-- Mobile navigation -->
      <button
        id="mobile-nav-toggle"
        class="icon-btn nav-toggle"
        aria-label="Open menu"
        aria-expanded="false"
        type="button"
      >
        <span></span>
        <span></span>
        <span></span>
      </button>

      <!-- Margin Logo -->
      <a href="#/" class="logo" data-link aria-label="Margin — Study Notes">

        <span class="logo__mark">M</span>

        <span class="logo__text">
          Margin
        </span>

      </a>

      <!-- Search -->
      <form
        id="header-search-form"
        class="header-search"
        role="search"
      >

        <input
          id="header-search-input"
          type="search"
          name="q"
          placeholder="Search notes, chapters, subjects…"
          aria-label="Search notes"
          autocomplete="off"
        />

        <button
          type="submit"
          class="icon-btn"
          aria-label="Search"
        >

          <svg
            width="18"
            height="18"
            viewBox="0 0 24 24"
            fill="none"
            aria-hidden="true"
          >
            <circle
              cx="11"
              cy="11"
              r="7"
              stroke="currentColor"
              stroke-width="2"
            />

            <path
              d="M21 21l-4.3-4.3"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
            />
          </svg>

        </button>

      </form>

      <!-- Navigation -->
      <nav
        id="primary-nav"
        class="primary-nav"
        aria-label="Primary navigation"
      >

        <a href="#/" data-link>
          Home
        </a>

        <a
          href="#/my-notes"
          data-link
          data-requires-auth
        >
          My Notes
        </a>

        <a
          href="#/admin"
          data-link
          data-requires-admin
          class="hidden"
        >
          Admin
        </a>

        <!-- Authentication -->
        <div id="auth-area" class="auth-area">

          <!-- Guest -->
          <a
            href="#/login"
            data-link
            class="btn btn--ghost"
            data-guest-only
          >
            Log in
          </a>

          <a
            href="#/signup"
            data-link
            class="btn btn--primary"
            data-guest-only
          >
            Sign up
          </a>

          <!-- Logged-in user -->
          <div
            class="user-menu hidden"
            data-user-only
          >

            <button
              id="user-menu-btn"
              class="user-chip"
              aria-haspopup="true"
              aria-expanded="false"
              type="button"
            >

              <span id="user-menu-initial">
                U
              </span>

            </button>

            <div
              id="user-menu-dropdown"
              class="user-menu__dropdown hidden"
            >

              <div
                class="user-menu__email"
                id="user-menu-email"
              ></div>

              <a
                href="#/my-notes"
                data-link
              >
                My Notes
              </a>

              <a
                href="#/admin"
                data-link
                data-requires-admin
                class="hidden"
              >
                Admin Dashboard
              </a>

              <button
                id="logout-btn"
                type="button"
              >
                Log out
              </button>

            </div>

          </div>

        </div>

      </nav>

    </div>

  </header>

  <!-- Main application content -->
  <main
    id="view-root"
    tabindex="-1"
  ></main>

  <!-- Footer -->
  <footer class="site-footer">

    <p>
      Margin — Study Notes by ARVEX.
    </p>

  </footer>

  <!-- Toast notifications -->
  <div
    id="toast-stack"
    class="toast-stack"
    aria-live="polite"
  ></div>

  <!-- Lightbox -->
  <template id="tpl-lightbox">

    <div
      class="lightbox"
      role="dialog"
      aria-modal="true"
    >

      <div class="lightbox__panel">

        <button
          class="lightbox__close icon-btn"
          aria-label="Close"
          type="button"
        >
          &times;
        </button>

        <div class="lightbox__body"></div>

      </div>

    </div>

  </template>

  <!-- Supabase -->
  <script
    src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"
  ></script>

  <!-- App configuration -->
  <script src="config.js"></script>

  <!-- Main application -->
  <script src="script.js"></script>

</body>
</html>
